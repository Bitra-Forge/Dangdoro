name: Daily Focus Time Integrity Audit

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Audit and Check for Duplicates
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }} # e.g. https://dangdoro.com
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "❌ Error: secrets.PRODUCTION_URL is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ Error: secrets.CRON_SECRET is not set."
            exit 1
          fi

          echo "⏳ Querying audit endpoint..."
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -L -o "$RESPONSE_FILE" -w "%{http_code}" -X GET "$PRODUCTION_URL/api/admin/audit-all-duplicates?dryRun=true" \
            -H "Authorization: Bearer $CRON_SECRET")

          RESPONSE=$(cat "$RESPONSE_FILE")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Error: Audit request failed with HTTP status code $HTTP_CODE"
            echo "Response: $RESPONSE"
            exit 1
          fi

          AFFECTED_USERS=$(echo "$RESPONSE" | jq -r '.affectedUsersCount')
          HIGH_SEVERITY=$(echo "$RESPONSE" | jq -r '.highSeverityDuplicates')
          LOW_SEVERITY=$(echo "$RESPONSE" | jq -r '.lowSeverityDuplicates')

          echo "=========================================="
          echo "Audit Scan Results:"
          echo "  - Total Users Scanned: $(echo "$RESPONSE" | jq -r '.totalUsersScanned')"
          echo "  - High-severity duplicates: $HIGH_SEVERITY  <- hard fail if > 0"
          echo "  - Low-severity flags: $LOW_SEVERITY  <- warning only"
          echo "  - Affected Users: $AFFECTED_USERS"
          echo "=========================================="

          # Always print all duplicates regardless of severity — nothing hidden
          echo "$RESPONSE" | jq -c '.affectedUsers[]'

          if [ "$HIGH_SEVERITY" -gt 0 ]; then
            echo "🚨 High-confidence duplicates detected — action required:"
            echo "$RESPONSE" | jq -r '.affectedUsers[].corrections[] | select(.severity == "high") | .message'
            # Fail the action to trigger an email notification
            exit 1
          else
            echo "✅ No high-severity duplicates — audit passed"
            if [ "$LOW_SEVERITY" -gt 0 ]; then
              echo "⚠️ Low-confidence flags (review but not failing):"
              echo "$RESPONSE" | jq -r '.affectedUsers[].corrections[] | select(.severity == "low") | .message'
              echo "⚠️  $LOW_SEVERITY low-confidence flags remain (previously reviewed)"
            else
              echo "✅ Success: Database has clean data integrity. No duplicates found."
            fi
          fi
